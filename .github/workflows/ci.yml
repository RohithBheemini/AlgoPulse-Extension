name: AlgoPulse CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-extension:
    name: Build Chrome Extension (MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - name: Install Dependencies
        run: cd extension && npm ci
      - name: Build Extension
        run: cd extension && npm run build

  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install Dependencies
        run: cd vscode-extension && npm ci
      - name: TypeScript Check
        run: cd vscode-extension && npx tsc --noEmit
      - name: Bundle Extension
        run: cd vscode-extension && npm run build

  build-dashboard:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dependencies
        run: cd dashboard && npm ci
      - name: TypeScript & Build
        run: cd dashboard && npm run build
